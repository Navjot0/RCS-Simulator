# Dropped 60 -> 10 minutes (cleanup interval 60s -> 30s). Root cause of the
# "server uses too much memory, only a restart brings it back down" report:
# MessageProcessor.doIngest() writes every accepted message into this map at
# ingestion time, and MessageStoreCleanupScheduler only evicts entries that
# are BOTH terminal AND older than this retention window - so for any load
# test shorter than the retention window, nothing is ever evicted and the
# map grows by total messages sent, not by concurrent in-flight count. At
# 60 minutes, a 10-30 minute load test never triggers a single eviction.
# 10 minutes keeps enough history for realistic late-status-query testing
# while bounding worst-case memory to "in-flight + ~10 minutes of terminal
# backlog" instead of "everything ever sent since startup."
operator.message-store.retention-minutes=10
operator.message-store.cleanup-interval-millis=30000

# Sized generously for zero-loss at high volume (tested against a 100k-request
# burst - see README "Capacity and the zero-loss guarantee"). Every queue
# below applies backpressure instead of dropping when full
# (InMemoryQueueService.publish() uses a blocking put()), EXCEPT INCOMING and
# CALLBACK, whose capacities are hardcoded unbounded in
# InMemoryQueueService.resolveCapacity() - see that class's Javadoc for why.
#
# incoming-publish-timeout-millis is STALE / no longer consulted. It
# describes an earlier design where MessageProcessor.doIngest() called
# tryPublish() (a bounded offer(timeout)) and returned an explicit 503 past
# this bound instead of blocking. That was reverted per explicit requirement
# - "never send back anything but a 200-series response, no matter the load"
# - since a fast 503 is still an error response the caller has to handle,
# not the unconditional success being asked for. doIngest() now calls the
# plain, unbounded publish() against an INCOMING queue that's itself
# unbounded (Integer.MAX_VALUE, like CALLBACK), so that call can never block
# long enough to matter and this timeout value is never reached. Left here,
# unused, only so re-introducing tryPublish() later doesn't also require
# re-adding this property.
operator.queue.incoming-publish-timeout-millis=1000
operator.queue.capacity=100000
# Legacy/fallback dispatcher-loop count: every queue's own worker count
# below defaults to workerThreads/4 unless overridden individually. Since
# InMemoryQueueService now runs each queue's dispatch loops on its own
# dedicated virtual-thread executor (see its class Javadoc), this no longer
# means "platform threads reserved for the whole pipeline" - raising it (or
# any *-workers override below) costs almost nothing, unlike before the
# virtual-thread migration.
operator.queue.worker-threads=64
# No longer consulted - INCOMING's capacity is hardcoded unbounded in
# InMemoryQueueService.resolveCapacity(), same as callback-queue-size below.
# Kept only for config-binding backward compatibility.
operator.queue.incoming-queue-size=50000
operator.queue.validation-queue-size=50000
operator.queue.processing-queue-size=50000
operator.queue.dlr-queue-size=50000
# No longer consulted - CALLBACK's capacity is hardcoded unbounded in
# InMemoryQueueService.resolveCapacity(). Kept only for config-binding
# backward compatibility.
operator.queue.callback-queue-size=50000
# Pool size for the low-frequency MessageStore/MediaStore cleanup jobs only
# (see AsyncConfig's taskScheduler bean) - the high-volume DLR/callback
# scheduling path no longer uses this pool at all, see operator.scheduler.*
# below.
operator.queue.scheduler-pool-size=16

# Per-stage dispatcher-loop counts. Each is unset (commented out) by
# default, meaning "fall back to operator.queue.worker-threads/4" - set any
# subset of these to tune one pipeline stage's concurrency independently of
# the others, e.g. give CALLBACK far more concurrent dispatch loops than
# DLR if your webhook receiver is slow, without touching anything else.
# See ProviderProperties.Queue#workersFor and InMemoryQueueService.
#
# Re-sized for operator.tps.limit=20000 (previously 10000). Each stage's
# actual per-task work determines whether it needs true Little's-Law scaling
# (concurrency = target TPS x average service time) or just cheap headroom:
#
#   INCOMING   does a real Thread.sleep(operator.latency.min/max-millis,
#              100-200ms) per message - this is the one stage that behaves
#              like genuine blocking I/O, so its worker count scales
#              linearly with target TPS: 20000 x 0.2s worst-case = 4000.
#              (At the old worker-threads/4 = 16-worker fallback, INCOMING's
#              real drain rate was only ~80-160 msg/s - far below what the
#              client was bursting - and the 50000-capacity INCOMING queue
#              silently absorbed the shortfall as a growing backlog until it
#              filled and publish() started blocking on every new request,
#              collapsing the accept rate to that ~100-160 TPS drain rate.
#              Undersizing this one is the failure mode to avoid.)
#   VALIDATION and PROCESSING are pure in-memory pass-throughs (no sleep, no
#              blocking call - see ValidationProcessor/ProcessingQueueConsumer)
#              - doubled for proportional headroom, not because Little's Law
#              requires it.
#   DLR        applies the state-machine transition and publishes to
#              CALLBACK - also in-memory only, no blocking I/O - doubled for
#              headroom, same reasoning as VALIDATION/PROCESSING.
#   CALLBACK   is the real bottleneck stage: CallbackQueueConsumer's first
#              delivery attempt runs a synchronous HTTP POST (see
#              CallbackEngine/CallbackClient) with up to a 3s connect + 5s
#              read timeout. Each message fires 2-3 DLR webhooks over its
#              lifecycle (e.g. SUBMITTED "sent" + DELIVERED "delivered"), so
#              callback POST volume runs at roughly 2x message TPS, not 1x -
#              sized against that, not a flat doubling. If your webhook
#              receiver responds slower than ~25-50ms under real load, this
#              needs to go higher than 2000 - that response time is an
#              external dependency this simulator doesn't control.
# See README "Independent per-stage worker tuning".
# Little's Law: 10,000 TPS x 0.2s worst-case Thread.sleep = 2000.
operator.queue.incoming-workers=2000
# Halved from 512 (their 20k-target value) - pure in-memory pass-throughs,
# scaled down proportionally with target TPS, same headroom ratio as before.
operator.queue.validation-workers=256
operator.queue.processing-workers=256
# Halved from 1024 (its 20k-target value) - same proportional-headroom
# reasoning as VALIDATION/PROCESSING above.
operator.queue.dlr-workers=512
# Raised 400 -> 750 to support operator.tps.limit=10000 above. Math: each
# message fires ~2 DLR callbacks over its lifecycle, so 10,000 TPS implies
# ~20,000 callback POSTs/sec sustained. Little's Law (concurrency = target
# rate x average service time) at the same ASSUMED ~35-40ms healthy
# response time used at every step so far gives ~750 concurrent connections
# needed - still an unverified guess, not a measured number; the receiver's
# real per-request latency and true concurrent-connection ceiling have never
# been confirmed with the client. 750 is still well below the 2000 that
# caused the mass-timeout incident (20:23:28-32 UTC), but it's the highest
# value tried since that incident - watch error counts closely after
# deploying, and be ready to dial this back down (and operator.tps.limit
# with it) if SocketTimeoutException or connection errors climb again.
operator.queue.callback-workers=750

# Hierarchical timing wheel backing every DLR lifecycle transition and
# callback retry backoff (replaces a single-locked-heap
# ScheduledThreadPoolExecutor - see TimingWheelScheduler's class Javadoc for
# the full "why" and the Big-O comparison). tick-duration-millis bounds
# scheduling resolution (a task may fire up to one tick late); wheel-size is
# the bucket count, so one revolution spans wheel-size * tick-duration-millis
# (default: 512 * 100ms = ~51.2s); worker-count caps how many due tasks may
# run concurrently at once (virtual threads have no fixed pool size to bound
# instead - see TimingWheelScheduler).
#
# worker-count raised 16 -> 512. Unlike the queue workers above, this one
# was never actually sized against target TPS in the first place - 16 was
# just the wheel's own default. It gates two things: every callback *retry*
# POST (CallbackEngine schedules retries through DlrScheduler, not the
# CALLBACK queue - only the first attempt goes through CallbackQueueConsumer)
# and the fast, non-blocking "fire this DLR transition" hand-off from
# DlrEngine. At 16, a burst of retries (e.g. if a webhook receiver hiccups
# under 20k TPS load) would serialize almost entirely behind just 16
# concurrent slots, independent of how generously CALLBACK itself is sized
# above. Raised well past a simple doubling since it was already
# under-provisioned relative to every other stage before this change.
operator.scheduler.tick-duration-millis=100
operator.scheduler.wheel-size=512
# Halved from 512 (its 20k-target value), same proportional scaling as the
# queue workers above - still comfortably above the original under-sized
# default of 16.
operator.scheduler.worker-count=256

# Allowed transitions per current state.
operator.state-machine.transitions.ACCEPTED=QUEUED,REJECTED
operator.state-machine.transitions.QUEUED=SUBMITTED,FAILED,EXPIRED
operator.state-machine.transitions.SUBMITTED=DELIVERED,FAILED,UNKNOWN,EXPIRED
operator.state-machine.transitions.DELIVERED=DISPLAYED,UNKNOWN
operator.state-machine.transitions.DISPLAYED=
operator.state-machine.transitions.FAILED=
operator.state-machine.transitions.REJECTED=
operator.state-machine.transitions.EXPIRED=
operator.state-machine.transitions.UNKNOWN=

operator.callback.connect-timeout-millis=3000
# Reverted 2000 -> 5000. The 2000 experiment made things measurably worse
# (SocketTimeoutException 5,462 -> 10,062, 429s 94,205 -> 131,239, CPU maxed
# at 404%): webhook.gtsstaging.com's real response time is apparently
# somewhere in the 2-5s range under load, not "hung indefinitely" - cutting
# the timeout to 2s reclassified those slow-but-working calls as failures,
# triggering retries (see operator.callback.retry.* below) that multiplied
# total callback POST volume instead of freeing capacity, which fed more
# load into an already CPU-saturated box. Back to 5000 to stop generating
# that extra retry volume.
operator.callback.read-timeout-millis=5000
# Pooled HTTP client sizing (see RestClientConfig) - replaces the JDK
# default client's implicit ~5-connections-per-destination ceiling, which
# became a callback-throughput bottleneck once queue backpressure was fixed.
# Raised alongside operator.queue.callback-workers=2000 above - kept >=
# callback-workers so the pool itself never becomes a new bottleneck, and
# so QueueWorkerConfigReporter's startup WARN (callback workers exceeding
# pool size) doesn't fire. max-connections-per-route matters more than
# max-total-connections here specifically: callback traffic funnels to a
# small number of real webhook hosts (the operator.instances.*/operator.wire
# .profiles.* callback domains), and pooling is per-route (per destination
# host), not a single shared bucket.
operator.callback.max-total-connections=750
operator.callback.max-connections-per-route=750

# Per-destination circuit breaker (CallbackCircuitBreaker) - trips OPEN for
# one callback URL after failure-threshold consecutive failures, skipping
# further attempts to it (no connection used, no timeout waited) for
# cool-down-millis before letting a single probe through to test recovery.
# Added because retry/backoff alone doesn't stop a persistently-dead
# destination from continuing to consume pooled connections and worker time
# on every attempt forever - at volume that can exceed the connection
# pool's sustainable drain rate for that one destination, and since the
# CALLBACK queue is deliberately unbounded (never blocks ingestion - see
# InMemoryQueueService), nothing else would stop that backlog from growing
# for as long as the destination stays down. See ProviderProperties.CircuitBreaker.
operator.callback.circuit-breaker.enabled=true
operator.callback.circuit-breaker.failure-threshold=10
operator.callback.circuit-breaker.cool-down-millis=30000

# Reverted 3 -> 5 per explicit request. Each callback event (a message
# fires ~2 over its lifecycle - SUBMITTED, DELIVERED) gets its own
# independent budget of 5 attempts before DEAD_LETTERED, so a message can
# still generate up to ~10 total callback attempts across its lifecycle,
# not 5 - see CallbackEngine.attempt(), which tracks attemptNumber per DLR
# event, not per message. Trade-off vs. 3: more total retry volume against
# an already-slow receiver (stageLatencyMillis for callback-queue was
# ~3516ms/attempt in the last metrics snapshot, close to the 5s
# read-timeout), but fewer messages given up on prematurely.
operator.callback.retry.max-attempts=5
operator.callback.retry.backoff-millis=2000
operator.callback.retry.backoff-multiplier=2.0
operator.callback.retry.backoff-max-millis=15000

operator.bulk.max-messages-per-batch=1000

# POST /v1/media + GET /media/{id}. Content-type allowlist and
# single-file-per-request rule are our own design choice; nothing here is
# ever written to disk - uploaded bytes live only in memory until
# retention-minutes elapses.
operator.media.allowed-content-types=image/jpeg,image/jpg,image/gif,image/png,video/mp4,video/mpeg,video/mpeg4,video/webm,application/pdf
# 10MB - simulator default, keep in sync with spring.servlet.multipart above
operator.media.max-file-size-bytes=10485760
# Same fix, same reasoning as operator.message-store.retention-minutes
# above - MediaStore holds raw uploaded bytes (up to max-file-size-bytes
# each) in memory with the identical retain-until-old-and-terminal pattern.
operator.media.retention-minutes=10
operator.media.cleanup-interval-millis=30000

# POST /v1/capability/check - a deterministic mock. capable-percentage is
# the chance (0-100) a given phone number is treated as RCS-capable; the
# result is deterministic per number for the life of the process (see
# CapabilityService).
operator.capability.capable-percentage=90

# Stress-testing mode: when enabled, collapses simulated ingestion latency
# (operator.latency.*, used by IncomingQueueConsumer) and per-state DLR
# delays (operator.dlr.delays-seconds.*, used by DlrEngine) toward the
# values below instead, without touching anything else - the state machine,
# DLR outcome probabilities, response DTOs and webhook payload shapes are
# all the exact same code path as normal operation, just reached faster.
# Intended purely for load/soak-testing this simulator's own throughput
# ceiling (10,000+ TPS), not everyday integration testing, where realistic
# timing is usually the point - leave disabled otherwise.
operator.performance-mode.enabled=true
operator.performance-mode.latency-min-millis=0
operator.performance-mode.latency-max-millis=0
operator.performance-mode.dlr-delay-seconds-override=0

# Runtime metrics recorder backing GET /metrics' "runtime" block (current/
# average/peak TPS, queue wait time, per-stage processing latency, callback
# latency/success rate/retry count, worker utilization, active thread count,
# memory usage, GC statistics - see RuntimeMetricsRecorder). Every recording
# call is a single boolean check away from being a true no-op when disabled,
# so turning this off entirely removes even that overhead on the hot path.
operator.metrics.enabled=true

# Full HTTP request/response audit logging (AuditLoggingFilter): wraps every
# request/response to log method, URI, headers, bodies, status and execution
# time as one AUDIT line per exchange. Disabled by default - it's real
# per-request overhead (body buffering + a log line every call) that nothing
# in this project's test suite depends on; turn it on only for occasional
# troubleshooting. See AuditLoggingFilter's class Javadoc.
operator.audit.enabled=false

# Real-provider wire-format profiles (see README "Real provider wire
# format"): each one adds a controller speaking that provider's actual
# inbound send contract (path, query params, body shape, OAuth token
# endpoint) alongside the self-designed POST /v1/messages, and sends DLRs in
# that provider's own real webhook format instead of this simulator's
# self-designed CallbackEnvelope. Point a CPaaS Provider row's base_url at
# this simulator with a /wire/<profile> suffix (e.g.
# http://simulator-host:8080/wire/dotgo) to have it call these endpoints
# instead of the real operator - no CPaaS code changes needed, since every
# provider adapter simply appends its fixed path suffix to whatever base_url
# is configured. Each profile is enabled by default; set enabled=false to
# make its controller(s) return 404 instead. callback-url is required for a
# profile's DLRs to actually be sent - the CPaaS package's
# LaravelServiceProvider registers routes/api.php under ->prefix('api'), so
# the real routes are /api/rcs/webhook/{vi,jio,airtel,rcs,dotgo}, NOT
# /rcs/webhook/<profile> - the /api segment is easy to miss and was
# previously omitted here, which made every Jio DLR hit a 405
# MethodNotAllowedHttpException (some non-API catch-all route matching
# GET/HEAD only) instead of the real webhook handler.
# Fixed OAuth2 access token shared by every wire profile's simulated token
# endpoint (Jio's GET /v1/oauth/token, Dotgo's and VI's POST
# /auth/oauth/token) - deliberately one static value across all providers
# instead of a fresh random token per request, so it can be hardcoded for
# manual testing or a future Bearer-validation layer. Airtel is unaffected -
# it uses HTTP Basic auth directly on the send call, no token step.
operator.wire.static-access-token=simulator-client-token
#
operator.wire.profiles.jio.enabled=true
operator.wire.profiles.jio.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/jio
operator.wire.profiles.dotgo.enabled=true
operator.wire.profiles.dotgo.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/dotgo
operator.wire.profiles.vi.enabled=true
operator.wire.profiles.vi.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/vi
operator.wire.profiles.airtel.enabled=true
operator.wire.profiles.airtel.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/airtel

# Multi-instance DLR callback routing: lets this one simulator deployment
# serve several CPaaS instances that each need their own callback
# destination per real-provider wire profile. Selected via the
# /{instance}/wire/{provider}/... URL prefix - e.g. a Provider row's
# base_url of http://simulator-host:8080/cerf/wire/vi routes that
# instance+provider's DLRs to operator.instances.cerf.profiles.vi.callback-url,
# completely independent of operator.instances.dev.profiles.vi.callback-url
# or the legacy un-prefixed operator.wire.profiles.vi.callback-url above
# (which is still used by plain /wire/vi/... requests with no instance
# segment). Every value here must be the complete callback URL - never
# built from a shared base-url + suffix, since these environments don't
# share a common host or path shape. Adding a new instance (e.g. "uat") is
# purely a matter of adding four more properties below; no Java code needs
# to change (see com.jio.rcs.operator.wire.CallbackUrlResolver).
# DEV
operator.instances.dev.profiles.jio.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/jio
operator.instances.dev.profiles.dotgo.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/dotgo
operator.instances.dev.profiles.vi.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/vi
operator.instances.dev.profiles.airtel.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/airtel

# STAGING
operator.instances.staging.profiles.jio.callback-url=https://webhook.cpaas.globeteleservices.com/api/rcs/webhook/jio
operator.instances.staging.profiles.dotgo.callback-url=https://webhook.cpaas.globeteleservices.com/api/rcs/webhook/dotgo
operator.instances.staging.profiles.vi.callback-url=https://webhook.cpaas.globeteleservices.com/api/rcs/webhook/vi
operator.instances.staging.profiles.airtel.callback-url=https://webhook.cpaas.globeteleservices.com/api/rcs/webhook/airtel

