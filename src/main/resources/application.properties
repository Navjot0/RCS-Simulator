operator.instances.cerf.profiles.dotgo.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/dotgo
operator.instances.cerf.profiles.vi.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/vi
operator.instances.cerf.profiles.airtel.callback-url=https://webhook.cerfsolutions.com/api/rcs/webhook/airtel

management.endpoints.web.exposure.include=health,info,metrics

# POST /admin/reset - clears MessageStore/MediaStore in memory without a
# full process restart (see AdminController). Left blank (default) means
# the endpoint is open, matching this simulator's no-auth posture
# everywhere else; set a value here and send it as the X-Admin-Secret
# header to require it.
operator.admin.reset-secret=
