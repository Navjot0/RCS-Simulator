# Reads the PORT env var if set (Render, Heroku, and most PaaS hosts inject
# this and route external traffic to whatever port it names), falling back
# to 8080 for local/default runs where PORT isn't set.
server.port=${PORT:8080}

# Tomcat's NIO connector - the layer that accepts a TCP connection *before*
# any request reaches this simulator's own internal queue pipeline below.
# Both were still on Spring Boot's defaults (max-conn0ections=8192,
# accept-count=100) even after the pipeline itself (operator.queue.*-workers,
# operator.tps.limit=20000 etc.) was sized for 20k TPS - accept-count in
# particular is the OS-level backlog of connections waiting to be accepted;
# at default 100 it's overwhelmed almost instantly by a real 20k TPS burst,
# which surfaces on the *client* side as connect timeouts (the kernel
# silently drops/delays new SYN packets once the backlog is full), not as
# any error this application ever gets a chance to log or respond to.
# Raised to the same order of magnitude as operator.queue.incoming-workers,
# with headroom.
#
# Raised again (1000 -> 4000) after WhatsAppMaxCapacityTester.java's
# MAX_CONCURRENCY=2000 load test kept showing a cluster of java.net.
# ConnectException on the client, entirely confined to the first ~3-4
# seconds of every run and never recurring afterward - the signature of the
# backlog itself being the limiter, not a sustained capacity problem. At
# 1000 the backlog was already below the harness's own instantaneous
# concurrency ceiling (2000): the harness's tight semaphore-gated loop keeps
# ~2000 connects in flight continuously, and while Tomcat's single acceptor
# thread is draining that queue, every replacement connect that arrives
# while the backlog is momentarily full gets refused outright by the OS
# (ECONNREFUSED -> ConnectException on the client) rather than queued. Once
# enough connections are established and reused via keep-alive, new connect
# attempts taper off and the backlog stops being the constraint - matching
# the observed "fails hard for a few seconds, then 96%+ success for the rest
# of a 100k-request run" pattern exactly. Set with headroom above any single
# load-test harness's concurrency ceiling, not just matched to it 1:1.
#
# NOTE: accept-count is a request to the OS, capped at whatever the host's
# own net.core.somaxconn sysctl allows - raising this property alone isn't
# enough if that OS-level ceiling is lower. See deployment notes for the
# sysctl/ulimit commands to run on the host itself. (Windows has no
# net.core.somaxconn - this cap doesn't apply when reproducing locally on
# Windows, only on the Linux deployment host.)
server.tomcat.max-connections=30000
server.tomcat.accept-count=10000

# Inbound keep-alive (client -> this app), previously left on Tomcat's
# built-in defaults instead of being set explicitly here:
#
# keep-alive-timeout: how long an accepted connection is held open, idle,
# waiting for the next request before Tomcat closes it. Default is 60000ms
# (falls back to connection-timeout when unset). Raised to 120000ms - a
# generous window for a load-test/high-volume client reusing the same
# persistent connections across many requests, so a brief lull in traffic
# doesn't force a reconnect.
#
# max-keep-alive-requests: separate from the above - the number of requests
# allowed on a single persistent connection before Tomcat force-closes it
# regardless of the timeout. Default is only 100. At 100k+ requests spread
# across MAX_CONCURRENCY=2000 client-side connections
# (WhatsAppMaxCapacityTester.java), that's ~50 requests/connection just to
# cover one run - a large share of "steady state" connections were hitting
# this 100-request ceiling and cycling continuously through the entire test,
# not just at startup, which is a second, ongoing source of new-connection
# overhead separate from the initial-burst problem accept-count/max-
# connections/the JVM heap flags addressed. Set to -1 (Tomcat's documented
# value for "unlimited") so a connection is only ever closed by the
# keep-alive timeout above, not by a request count.
server.tomcat.keep-alive-timeout=120000
server.tomcat.max-keep-alive-requests=-1

