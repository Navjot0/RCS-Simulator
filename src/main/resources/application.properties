# Reads the PORT env var if set (Render, Heroku, and most PaaS hosts inject
# this and route external traffic to whatever port it names), falling back
# to 8080 for local/default runs where PORT isn't set.
server.port=${PORT:8080}

spring.application.name=rcs-simulator
# Spring Boot's own switch for the embedded Tomcat request-handling pool
# (i.e. the thread that first receives POST /v1/messages, before the
# request ever reaches this simulator's own internal queue pipeline).
# Enabled as part of the Phase 1 performance work: MessageProcessor.ingest()
# calls QueueService.publish(), which can block on a full INCOMING queue
# under sustained backpressure (see InMemoryQueueService's class Javadoc) -
# on Tomcat's default fixed-size platform-thread pool (200 threads), enough
# concurrently-blocked requests would exhaust it and start rejecting new
# connections outright. Virtual threads unmount instead of occupying a
# scarce platform thread while blocked, exactly like every internal
# dispatcher loop in this simulator (see InMemoryQueueService) - this is
# the same fix applied one layer further out, at the very first thread a
# request touches.
spring.threads.virtual.enabled=true

# All API timestamps (DLR webhooks, message status, health, media, etc.) are
# rendered in Indian Standard Time (UTC+05:30) with an explicit offset, e.g.
# 2026-07-21T18:17:46.867122+05:30, instead of UTC "Z". Applies to every
# typed Instant field Jackson serializes; see com.jio.rcs.operator.util.IstTime
# for the couple of places that build a timestamp String by hand instead and
# so need to convert explicitly (CallbackEngine's webhook_data.entity.sendTime,
# MonitoringController's /health timestamp).
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-with-context-time-zone=true

spring.servlet.multipart.enabled=true
# keep in sync with operator.media.max-file-size-bytes below
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# INFO by default, not DEBUG: per-message/per-event log lines (message
# accepted, DLR transition, validation rejection, callback delivered/
# retried) were downgraded from log.info to log.debug so they're silent by
# default at high TPS - only genuinely one-time/operational lines (startup,
# shutdown, warnings, errors) still show at INFO. Set this to DEBUG when you
# need full per-message tracing for local troubleshooting.
logging.level.root=INFO
logging.level.com.jio.rcs.operator=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

operator.identity.provider-name=RCS_SIMULATOR
operator.identity.provider-code=SIM
operator.identity.provider-display-name=RCS Provider Simulator
# Cosmetic simulated bot/agent registration id echoed into every DLR
# webhook's delivery_status/additional_data.webhook_data.botId - for parity
# with a real captured provider payload shape. Nothing else reads this.
operator.identity.bot-id=SIMULATOR-BOT-000000000001

operator.callback-url=http://127.0.0.1:9000/webhook

operator.tps.enabled=true
operator.tps.limit=10000
operator.tps.window-millis=1000

operator.latency.min-millis=100
operator.latency.max-millis=200

# configurable delay (in seconds) before each state is reached, measured
# from message acceptance time
operator.dlr.delays-seconds.ACCEPTED=0
operator.dlr.delays-seconds.QUEUED=1
operator.dlr.delays-seconds.SUBMITTED=2
operator.dlr.delays-seconds.DELIVERED=3
operator.dlr.delays-seconds.DISPLAYED=4
operator.dlr.delays-seconds.FAILED=2
operator.dlr.delays-seconds.REJECTED=0
operator.dlr.delays-seconds.EXPIRED=10
operator.dlr.delays-seconds.UNKNOWN=5

# chance (0-100) message reaches DELIVERED after SUBMITTED
operator.probability.delivered-percentage=100
# chance (0-100) a DELIVERED message progresses to DISPLAYED. Set to 0 so no
# message ever reaches DISPLAYED - i.e. no READ/DISPLAYED DLR is ever sent,
# for any provider (self-designed or wire format alike). Messages now stop
# at DELIVERED as their terminal success state.
operator.probability.displayed-percentage=0
# chance (0-100) message fails outright during processing - kept at 0 so
# every message actually reaches DELIVERED (failed-percentage is rolled
# first in DefaultDlrOutcomeStrategy, so a non-zero value here would still
# fail some messages even with delivered-percentage=100)
operator.probability.failed-percentage=0

operator.error-simulation.enabled=true

operator.error-simulation.codes[0].code=INVALID_PHONE
operator.error-simulation.codes[0].description=The destination phone number is not a valid MSISDN
operator.error-simulation.codes[0].weight=20

operator.error-simulation.codes[1].code=NOT_RCS_USER
operator.error-simulation.codes[1].description=Destination subscriber is not RCS provisioned
operator.error-simulation.codes[1].weight=25

operator.error-simulation.codes[2].code=DEVICE_OFFLINE
operator.error-simulation.codes[2].description=Destination device is currently offline
operator.error-simulation.codes[2].weight=25

operator.error-simulation.codes[3].code=NETWORK_FAILURE
operator.error-simulation.codes[3].description=Transient network failure at the operator
operator.error-simulation.codes[3].weight=15

operator.error-simulation.codes[4].code=RATE_LIMIT
operator.error-simulation.codes[4].description=Agent exceeded contracted rate limit
operator.error-simulation.codes[4].weight=5

operator.error-simulation.codes[5].code=SERVICE_UNAVAILABLE
operator.error-simulation.codes[5].description=Operator service temporarily unavailable
operator.error-simulation.codes[5].weight=5

operator.error-simulation.codes[6].code=UNKNOWN
operator.error-simulation.codes[6].description=Unknown provider error
operator.error-simulation.codes[6].weight=5

# How long a message's in-memory correlation record is kept after it
# reaches a terminal state, purely to answer late status queries. This is
# not persistence - it is bounded, in-process memory that is discarded on
# restart and periodically swept by MessageStoreCleanupScheduler.
operator.message-store.retention-minutes=60
operator.message-store.cleanup-interval-millis=60000

# Sized generously for zero-loss at high volume (tested against a 100k-request
# burst - see README "Capacity and the zero-loss guarantee"). Every queue
# below applies backpressure instead of dropping when full
# (InMemoryQueueService.publish() uses a blocking put()), so these sizes are
# about keeping that backpressure rare under realistic load, not a hard
# cutoff where messages start getting lost.
operator.queue.capacity=100000
# Legacy/fallback dispatcher-loop count: every queue's own worker count
# below defaults to workerThreads/4 unless overridden individually. Since
# InMemoryQueueService now runs each queue's dispatch loops on its own
# dedicated virtual-thread executor (see its class Javadoc), this no longer
# means "platform threads reserved for the whole pipeline" - raising it (or
# any *-workers override below) costs almost nothing, unlike before the
# virtual-thread migration.
operator.queue.worker-threads=64
operator.queue.incoming-queue-size=50000
operator.queue.validation-queue-size=50000
operator.queue.processing-queue-size=50000
operator.queue.dlr-queue-size=50000
operator.queue.callback-queue-size=50000
# Pool size for the low-frequency MessageStore/MediaStore cleanup jobs only
# (see AsyncConfig's taskScheduler bean) - the high-volume DLR/callback
# scheduling path no longer uses this pool at all, see operator.scheduler.*
# below.
operator.queue.scheduler-pool-size=16

# Per-stage dispatcher-loop counts. Each is unset (commented out) by
# default, meaning "fall back to operator.queue.worker-threads/4" - set any
# subset of these to tune one pipeline stage's concurrency independently of
# the others, e.g. give CALLBACK far more concurrent dispatch loops than
# DLR if your webhook receiver is slow, without touching anything else.
# See ProviderProperties.Queue#workersFor and InMemoryQueueService.
# Sized for operator.tps.limit=10000 against operator.latency.min/max-millis
# (100-200ms simulated ingestion latency) via Little's Law: concurrency
# needed = target TPS x average service time. At the previous fallback of
# worker-threads/4 = 16 incoming workers, INCOMING's real sustained drain
# rate was only ~16 / 0.15s (avg) = ~80-160 msg/s - far below what the
# client was bursting. The 50000-capacity INCOMING queue absorbed the
# difference as a growing backlog, which is why throughput looked fine
# (2500+ TPS) right up until that buffer filled at ~50000 queued messages -
# at that point publish() started blocking on every new request and the
# accept rate collapsed to INCOMING's real drain rate (~104-160 TPS,
# matching exactly what was reported). Raised to comfortably clear
# 10,000 TPS at the worst-case 200ms latency (10000 x 0.2s = 2000) with
# headroom. See README "Independent per-stage worker tuning".
operator.queue.incoming-workers=2000
operator.queue.validation-workers=256
operator.queue.processing-workers=256
operator.queue.dlr-workers=512
operator.queue.callback-workers=512

# Hierarchical timing wheel backing every DLR lifecycle transition and
# callback retry backoff (replaces a single-locked-heap
# ScheduledThreadPoolExecutor - see TimingWheelScheduler's class Javadoc for
# the full "why" and the Big-O comparison). tick-duration-millis bounds
# scheduling resolution (a task may fire up to one tick late); wheel-size is
# the bucket count, so one revolution spans wheel-size * tick-duration-millis
# (default: 512 * 100ms = ~51.2s); worker-count caps how many due tasks may
# run concurrently at once (virtual threads have no fixed pool size to bound
# instead - see TimingWheelScheduler).
operator.scheduler.tick-duration-millis=100
operator.scheduler.wheel-size=512
operator.scheduler.worker-count=16

# Allowed transitions per current state.
operator.state-machine.transitions.ACCEPTED=QUEUED,REJECTED
operator.state-machine.transitions.QUEUED=SUBMITTED,FAILED,EXPIRED
operator.state-machine.transitions.SUBMITTED=DELIVERED,FAILED,UNKNOWN,EXPIRED
operator.state-machine.transitions.DELIVERED=DISPLAYED,UNKNOWN
operator.state-machine.transitions.DISPLAYED=
operator.state-machine.transitions.FAILED=
operator.state-machine.transitions.REJECTED=
operator.state-machine.transitions.EXPIRED=
operator.state-machine.transitions.UNKNOWN=

operator.callback.connect-timeout-millis=3000
operator.callback.read-timeout-millis=5000
# Pooled HTTP client sizing (see RestClientConfig) - replaces the JDK
# default client's implicit ~5-connections-per-destination ceiling, which
# became a callback-throughput bottleneck once queue backpressure was fixed.
# Raised alongside operator.queue.callback-workers=512 above - kept >=
# callback-workers so the pool itself never becomes a new bottleneck, and
# so QueueWorkerConfigReporter's startup WARN (callback workers exceeding
# pool size) doesn't fire.
operator.callback.max-total-connections=600
operator.callback.max-connections-per-route=600
operator.callback.retry.max-attempts=5
operator.callback.retry.backoff-millis=2000
operator.callback.retry.backoff-multiplier=2.0
operator.callback.retry.backoff-max-millis=15000

operator.bulk.max-messages-per-batch=1000

# POST /v1/media + GET /media/{id}. Content-type allowlist and
# single-file-per-request rule are our own design choice; nothing here is
# ever written to disk - uploaded bytes live only in memory until
# retention-minutes elapses.
operator.media.allowed-content-types=image/jpeg,image/jpg,image/gif,image/png,video/mp4,video/mpeg,video/mpeg4,video/webm,application/pdf
# 10MB - simulator default, keep in sync with spring.servlet.multipart above
operator.media.max-file-size-bytes=10485760
operator.media.retention-minutes=60
operator.media.cleanup-interval-millis=60000

# POST /v1/capability/check - a deterministic mock. capable-percentage is
# the chance (0-100) a given phone number is treated as RCS-capable; the
# result is deterministic per number for the life of the process (see
# CapabilityService).
operator.capability.capable-percentage=90

# Stress-testing mode: when enabled, collapses simulated ingestion latency
# (operator.latency.*, used by IncomingQueueConsumer) and per-state DLR
# delays (operator.dlr.delays-seconds.*, used by DlrEngine) toward the
# values below instead, without touching anything else - the state machine,
# DLR outcome probabilities, response DTOs and webhook payload shapes are
# all the exact same code path as normal operation, just reached faster.
# Intended purely for load/soak-testing this simulator's own throughput
# ceiling (10,000+ TPS), not everyday integration testing, where realistic
# timing is usually the point - leave disabled otherwise.
operator.performance-mode.enabled=false
operator.performance-mode.latency-min-millis=0
operator.performance-mode.latency-max-millis=0
operator.performance-mode.dlr-delay-seconds-override=0

# Runtime metrics recorder backing GET /metrics' "runtime" block (current/
# average/peak TPS, queue wait time, per-stage processing latency, callback
# latency/success rate/retry count, worker utilization, active thread count,
# memory usage, GC statistics - see RuntimeMetricsRecorder). Every recording
# call is a single boolean check away from being a true no-op when disabled,
# so turning this off entirely removes even that overhead on the hot path.
operator.metrics.enabled=true

# Full HTTP request/response audit logging (AuditLoggingFilter): wraps every
# request/response to log method, URI, headers, bodies, status and execution
# time as one AUDIT line per exchange. Disabled by default - it's real
# per-request overhead (body buffering + a log line every call) that nothing
# in this project's test suite depends on; turn it on only for occasional
# troubleshooting. See AuditLoggingFilter's class Javadoc.
operator.audit.enabled=false

# Real-provider wire-format profiles (see README "Real provider wire
# format"): each one adds a controller speaking that provider's actual
# inbound send contract (path, query params, body shape, OAuth token
# endpoint) alongside the self-designed POST /v1/messages, and sends DLRs in
# that provider's own real webhook format instead of this simulator's
# self-designed CallbackEnvelope. Point a CPaaS Provider row's base_url at
# this simulator with a /wire/<profile> suffix (e.g.
# http://simulator-host:8080/wire/dotgo) to have it call these endpoints
# instead of the real operator - no CPaaS code changes needed, since every
# provider adapter simply appends its fixed path suffix to whatever base_url
# is configured. Each profile is enabled by default; set enabled=false to
# make its controller(s) return 404 instead. callback-url is required for a
# profile's DLRs to actually be sent - the CPaaS package's
# LaravelServiceProvider registers routes/api.php under ->prefix('api'), so
# the real routes are /api/rcs/webhook/{vi,jio,airtel,rcs,dotgo}, NOT
# /rcs/webhook/<profile> - the /api segment is easy to miss and was
# previously omitted here, which made every Jio DLR hit a 405
# MethodNotAllowedHttpException (some non-API catch-all route matching
# GET/HEAD only) instead of the real webhook handler.
# Fixed OAuth2 access token shared by every wire profile's simulated token
# endpoint (Jio's GET /v1/oauth/token, Dotgo's and VI's POST
# /auth/oauth/token) - deliberately one static value across all providers
# instead of a fresh random token per request, so it can be hardcoded for
# manual testing or a future Bearer-validation layer. Airtel is unaffected -
# it uses HTTP Basic auth directly on the send call, no token step.
operator.wire.static-access-token=simulator-client-token

operator.wire.profiles.jio.enabled=true
operator.wire.profiles.jio.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/jio
operator.wire.profiles.dotgo.enabled=true
operator.wire.profiles.dotgo.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/dotgo
operator.wire.profiles.vi.enabled=true
operator.wire.profiles.vi.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/vi
operator.wire.profiles.airtel.enabled=true
operator.wire.profiles.airtel.callback-url=https://webhook.gtsstaging.com/api/rcs/webhook/airtel

management.endpoints.web.exposure.include=health,info,metrics
